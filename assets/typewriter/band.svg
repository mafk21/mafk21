    <text x="150" y="240" class="lab0" text-anchor="middle" fill="#e6edf3" fill-opacity="0.44" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4.4" font-weight="500">you type it</text>
