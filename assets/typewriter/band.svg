<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="How a build runs: you write a brief, agents build it, it runs locally, you keep the file">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes sweep { from { stroke-dashoffset: 1080; } to { stroke-dashoffset: 0; } }
    .rule { stroke-dasharray: 1080; animation: sweep 1.6s .2s ease-out both; }
    .lab0 { animation: rise .6s 0.90s cubic-bezier(.2,.7,.3,1) both; }
