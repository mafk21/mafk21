  <text x="40" y="74" class="kmid" text-anchor="start" fill="#1b1a17" fill-opacity="0.55" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4.2" font-weight="500">A SMALL PRACTICE IN LOCAL MACHINES</text>

