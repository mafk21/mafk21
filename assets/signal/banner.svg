        <animate attributeName="opacity" dur="4.2s" begin="0.45s" repeatCount="indefinite" values="0;0.9;0.9;0" keyTimes="0;0.12;0.86;1"/>
      </circle>
      <circle cx="0" cy="0" r="2.2" fill="#e8a33d" opacity="0">
