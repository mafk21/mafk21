        <animate attributeName="opacity" dur="4.2s" begin="0.9s" repeatCount="indefinite" values="0;0.9;0.9;0" keyTimes="0;0.12;0.86;1"/>
      </circle>
      <circle cx="0" cy="0" r="2.2" fill="#e8a33d" opacity="0">
        <animateMotion dur="4.2s" begin="1.35s" repeatCount="indefinite" path="M1124 110 L1194 168" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.6 1"/>
        <animate attributeName="opacity" dur="4.2s" begin="1.35s" repeatCount="indefinite" values="0;0.9;0.9;0" keyTimes="0;0.12;0.86;1"/>
      </circle>
      <circle cx="0" cy="0" r="2.2" fill="#e8a33d" opacity="0">
        <animateMotion dur="4.2s" begin="1.8s" repeatCount="indefinite" path="M1124 110 L1000 120" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.6 1"/>
        <animate attributeName="opacity" dur="4.2s" begin="1.8s" repeatCount="indefinite" values="0;0.9;0.9;0" keyTimes="0;0.12;0.86;1"/>
