      <path d="M1280 30 V42" opacity="0.09"/>
    <path d="M0 198 H1280" opacity="0.22"/>
  </g>

  <g clip-path="url(#sclip)">
    <text x="2" y="150" fill="#f2efe9" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="74"
          letter-spacing="0.2">Dr. Abo 3tab</text>
  </g>

  <rect class="head" x="478" y="88" width="2.5" height="66" fill="#e8a33d"/>

  <path class="rule" d="M2 174 H462" stroke="#e8a33d" stroke-width="1.6" opacity="0.85"/>

  <text x="4" y="70" class="k1" text-anchor="start" fill="#f2efe9" fill-opacity="0.6" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4.4" font-weight="500">LOCAL-FIRST AI  ·  AUTONOMOUS AGENTS  ·  TOOLS THAT SHIP AS FILES</text>

  <g class="k2">
    <circle class="live" cx="16" cy="196" r="3.4" fill="#e8a33d"/>
    <text x="30" y="200" text-anchor="start" fill="#f2efe9" fill-opacity="0.58" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3.2" font-weight="500">BUILDING JARVIS · LOCAL-FIRST</text>
  </g>

